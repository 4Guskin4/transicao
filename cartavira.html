<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virar Carta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .card {
      position: relative;
      width: 180px;
      height: 260px;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      perspective: 1000px;
    }

    .card.animar-virar {
      animation: girarParaVerso 0.6s forwards;
    }

    .card.animar-desvirar {
      animation: girarParaFrente 0.6s forwards;
    }

    @keyframes girarParaVerso {
      from {
        transform: rotateY(0deg);
      }
      to {
        transform: rotateY(180deg);
      }
    }

    @keyframes girarParaFrente {
      from {
        transform: rotateY(180deg);
      }
      to {
        transform: rotateY(0deg);
      }
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background-color: #2563eb;
      border: 4px solid #1d4ed8;
    }

    .card-back {
      background-color: #dc2626;
      border: 4px solid #b91c1c;
      transform: rotateY(180deg);
    }

    .button-group {
      display: flex;
      gap: 16px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #1e293b;
      color: #ffffff;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="carta">
      <div class="card-face card-front">Frente</div>
      <div class="card-face card-back">Verso</div>
    </div>

    <div class="button-group">
      <button id="btnVirar" type="button">Virar Carta</button>
      <button id="btnDesvirar" type="button">Desvirar Carta</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const carta = document.getElementById('carta');
      const btnVirar = document.getElementById('btnVirar');
      const btnDesvirar = document.getElementById('btnDesvirar');

      btnVirar.addEventListener('click', () => {
        carta.classList.remove('animar-desvirar');
        carta.classList.add('animar-virar');
      });

      btnDesvirar.addEventListener('click', () => {
        carta.classList.remove('animar-virar');
        carta.classList.add('animar-desvirar');
      });
    });
  </script>
</body>
</html>
