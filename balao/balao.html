<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animação do Balão</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
      overflow: hidden;
      position: relative;
    }

    .cenario {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .balao {
      position: absolute;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 100px;
      background-color: #ff4757;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -10px -10px 0 rgba(0, 0, 0, 0.15);
      animation: subirBalao 6s linear infinite;
    }

    .no {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 10px solid #ff4757;
    }

    .corda {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 30px;
      background-color: #555;
    }

    @keyframes subirBalao {
      0% {
        bottom: -150px;
        transform: translateX(-50%) rotate(0deg);
      }
      50% {
        transform: translateX(calc(-50% + 20px)) rotate(5deg);
      }
      100% {
        bottom: 110vh;
        transform: translateX(-50%) rotate(-5deg);
      }
    }
  </style>
</head>
<body>

  <div class="cenario">
    <div class="balao">
      <div class="no"></div>
      <div class="corda"></div>
    </div>
  </div>

</body>
</html>
